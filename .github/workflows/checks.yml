name: Check the scoring demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.0.2
      - run: python -m pytest -q
